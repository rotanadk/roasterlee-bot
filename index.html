<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoasterLee</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f4f1eb;color:#201d19}.wrap{max-width:850px;margin:auto;padding:16px}h1{margin:8px 0}.card{background:white;border:1px solid #ddd5c9;border-radius:16px;padding:16px;margin:12px 0}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #cfc6b8}button{background:#28231e;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.stat{background:#f6f3ee;padding:12px;border-radius:12px}.big{font-size:24px;font-weight:700}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid #eee;padding:10px 0}.muted{color:#746b60;font-size:13px}.danger{background:#8b2d2d}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.grid input{grid-column:span 2}}</style></head><body><div class="wrap"><h1>RoasterLee</h1><div class="muted">Roastery Production Planner</div><div id="msg" class="card">Loading…</div><div id="app" hidden><div class="card"><b>Add customer order</b><form id="order" class="grid" style="margin-top:10px"><input id="customer" placeholder="Customer" required><select id="blend"></select><input id="kg" type="number" step="0.1" min="0.1" placeholder="kg" required><button>Add</button></form></div><div class="card"><b>Roasting requirements</b><div id="summary" class="stats" style="margin-top:10px"></div><div class="muted" style="margin-top:8px">Roast batches use a maximum 6 kg per batch. Quantities shown are finished blend allocation before roast-loss adjustment.</div></div><div class="card"><b>Orders</b><div id="orders"></div></div><div id="admin" class="card" hidden><b>Staff access</b><div id="users"></div></div></div></div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const init=tg?.initData||'';let S;async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json','x-telegram-init-data':init};const r=await fetch(path,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){try{S=await api('/api/state');msg.hidden=true;app.hidden=false;blend.innerHTML=S.blends.map(b=>`<option>${b.code}</option>`).join('');render()}catch(e){msg.textContent=e.message}}function render(){let need={};S.orders.filter(o=>o.status!=='Done').forEach(o=>{let b=S.blends.find(x=>x.code===o.blend);if(b)Object.entries(b.recipe).forEach(([bean,r])=>need[bean]=(need[bean]||0)+o.kg*r)});summary.innerHTML=Object.entries(need).map(([bean,kg])=>`<div class=stat><div>${bean}</div><div class=big>${kg.toFixed(2)} kg</div><div class=muted>${Math.floor(kg/6)} × 6kg${kg%6>.01?` + ${(kg%6).toFixed(2)}kg`:''}</div></div>`).join('')||'<span class=muted>No pending production.</span>';orders.innerHTML=S.orders.map(o=>`<div class=row><div><b>${o.customer}</b><div class=muted>${o.blend} · ${o.kg} kg · ${o.status}</div></div><button data-id=${o.id} data-status="${o.status==='Done'?'Pending':'Done'}">${o.status==='Done'?'Reopen':'Done'}</button></div>`).join('')||'<div class=muted>No orders yet.</div>';if(S.me.role==='admin'){admin.hidden=false;users.innerHTML=S.users.map(u=>`<div class=row><div>${u.name||u.id}<div class=muted>${u.id} · ${u.role} · ${u.status}</div></div>${u.id==401102212?'Owner':`<button data-user=${u.id} data-access="${u.status==='approved'?'blocked':'approved'}">${u.status==='approved'?'Block':'Approve'}</button>`}</div>`).join('')}}order.addEventListener('submit',async e=>{e.preventDefault();await api('/api/orders',{method:'POST',body:JSON.stringify({customer:customer.value,blend:blend.value,kg:+kg.value})});customer.value='';kg.value='';await load()});orders.addEventListener('click',async e=>{if(e.target.dataset.id){await api('/api/orders/'+e.target.dataset.id,{method:'PATCH',body:JSON.stringify({status:e.target.dataset.status})});await load()}});users.addEventListener('click',async e=>{if(e.target.dataset.user){await api('/api/users/'+e.target.dataset.user,{method:'PATCH',body:JSON.stringify({status:e.target.dataset.access})});await load()}});load();</script></body></html>
